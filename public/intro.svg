<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="neonIntroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#99e600" />
    </linearGradient>
    <filter id="introGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(60, 40)">
    <!-- Monogram Emblem -->
    <g fill="url(#neonIntroGrad)" filter="url(#introGlow)">
      <path d="M 15 35 L 55 35 L 75 0 L 105 0 L 85 35 L 125 35 L 115 55 L 75 55 L 45 105 C 38 118 48 128 65 128 L 115 128 L 110 145 L 60 145 C 28 145 15 125 25 102 L 53 55 L 25 55 Z" />
      <path d="M 95 55 L 75 90 C 70 98 75 105 85 105 L 115 105 L 122 90 L 92 90 L 105 68 L 125 68 Z" />
    </g>

    <!-- TOTY SPORT -->
    <g transform="translate(170, 90)">
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="70" letter-spacing="6" fill="#FFFFFF">
        TOTY
      </text>
      <text x="240" y="0" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="70" letter-spacing="6" fill="url(#neonIntroGrad)">
        SPORT
      </text>
      <text x="5" y="42" font-family="system-ui, -apple-system, 'Outfit', 'Inter', sans-serif" font-weight="700" font-size="18" letter-spacing="8" fill="#AAAAAA">
        MORE THAN JUST A JERSEY
      </text>
    </g>
  </g>
</svg>
